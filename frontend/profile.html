<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — ConceptClear AI</title>
  <meta name="description" content="Manage your ConceptClear AI profile, academic grade settings, and preferred language.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
          <div class="sidebar-brand-icon"><i data-lucide="brain" style="width: 18px; height: 18px;"></i></div>
          <span>ConceptClear AI</span>
        </a>
      </div>

      <ul class="sidebar-menu">
        <li>
          <a id="nav-dashboard-link" href="/student-dashboard.html" class="sidebar-item-link">
            <i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="/learn.html" class="sidebar-item-link">
            <i data-lucide="book-open" style="width: 18px; height: 18px;"></i>
            <span>My Learning</span>
          </a>
        </li>
        <li>
          <a href="/tests.html" class="sidebar-item-link">
            <i data-lucide="file-text" style="width: 18px; height: 18px;"></i>
            <span>Take a Test</span>
          </a>
        </li>
        <li>
          <a href="/concept-map.html" class="sidebar-item-link">
            <i data-lucide="network" style="width: 18px; height: 18px;"></i>
            <span>Concept Map</span>
          </a>
        </li>
        <li>
          <a href="/analytics.html" class="sidebar-item-link">
            <i data-lucide="line-chart" style="width: 18px; height: 18px;"></i>
            <span>My Progress</span>
          </a>
        </li>
        <li>
          <a href="/profile.html" class="sidebar-item-link active">
            <i data-lucide="user" style="width: 18px; height: 18px;"></i>
            <span>Profile</span>
          </a>
        </li>
        <li style="margin-top: auto;">
          <a href="#" class="sidebar-item-link" onclick="logout(); return false;" style="color: #F87171;">
            <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" aria-label="Toggle navigation"><i data-lucide="menu"></i></button>
          <div class="topbar-greeting">
            <h2>Account & Preferences ⚙️</h2>
            <p>Configure language preferences, academic level, and personal settings</p>
          </div>
        </div>

        <div class="topbar-right">
          <button class="btn btn-secondary btn-sm" onclick="logout()">
            <i data-lucide="log-out" style="width: 14px; height: 14px;"></i> Sign Out
          </button>
        </div>
      </header>

      <main class="dashboard-content" style="max-width: 800px;">
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="flex items-center gap-4" style="padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem;">
            <div id="profile-avatar-circle" class="avatar-circle" style="width: 64px; height: 64px; font-size: 1.5rem;">
              U
            </div>
            <div>
              <h3 id="profile-name-header" style="font-size: 1.35rem; font-weight: 800; color: var(--navy-900);">Loading...</h3>
              <div id="profile-email-header" style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.35rem;">user@example.com</div>
              <span id="profile-role-badge" class="badge badge-primary">Student</span>
            </div>
          </div>

          <form id="profile-update-form">
            <div class="form-group">
              <label class="form-label" for="profile-fullname">Full Name</label>
              <input type="text" id="profile-fullname" class="form-input" required>
            </div>

            <div class="grid grid-2" style="gap: 1rem;">
              <div class="form-group">
                <label class="form-label" for="profile-lang">Preferred Language for AI Tutor</label>
                <select id="profile-lang" class="form-select">
                  <option value="en">English</option>
                  <option value="hi">हिंदी (Hindi)</option>
                  <option value="mr">मराठी (Marathi)</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="profile-class">Class / Academic Level</label>
                <input type="text" id="profile-class" class="form-input">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="profile-school">School / Institution</label>
              <input type="text" id="profile-school" class="form-input" placeholder="e.g. Apex Academy">
            </div>

            <div class="flex items-center justify-between" style="margin-top: 2rem;">
              <span id="profile-saved-msg" style="font-size: 0.85rem; color: var(--success-green); font-weight: 600;"></span>
              <button type="submit" class="btn btn-primary">
                <i data-lucide="save" style="width: 16px; height: 16px;"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = getUser();
      if (!user) {
        window.location.href = '/student-login.html';
        return;
      }

      if (user.role === 'teacher') {
        const dashLink = document.getElementById('nav-dashboard-link');
        if (dashLink) dashLink.href = '/teacher-dashboard.html';
      }

      // Populate form
      document.getElementById('profile-fullname').value = user.full_name || '';
      document.getElementById('profile-name-header').textContent = user.full_name || 'User';
      document.getElementById('profile-email-header').textContent = user.email || '';
      document.getElementById('profile-avatar-circle').textContent = (user.full_name || 'U').charAt(0).toUpperCase();
      document.getElementById('profile-role-badge').textContent = user.role.toUpperCase();
      document.getElementById('profile-class').value = user.academic_level || '';
      document.getElementById('profile-school').value = user.school || '';
      document.getElementById('profile-lang').value = user.preferred_language || 'en';

      const form = document.getElementById('profile-update-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const full_name = document.getElementById('profile-fullname').value.trim();
        const preferred_language = document.getElementById('profile-lang').value;
        const academic_level = document.getElementById('profile-class').value.trim();
        const school = document.getElementById('profile-school').value.trim();

        try {
          await fetchWithAuth('/auth/profile', {
            method: 'PUT',
            body: JSON.stringify({ full_name, preferred_language, academic_level, school })
          });

          // Update local session
          user.full_name = full_name;
          user.preferred_language = preferred_language;
          user.academic_level = academic_level;
          user.school = school;
          localStorage.setItem('conceptclear_user', JSON.stringify(user));
          setStoredLang(preferred_language);

          showToast('Profile updated successfully!', 'success');
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      renderLucideIcons();
    });
  </script>
</body>
</html>
